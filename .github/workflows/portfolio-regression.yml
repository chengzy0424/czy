name: Portfolio integration regression
on:
  push:
    branches: ['codex/hls-gallery-integration-20261102', 'codex/safari-hls-compatibility-20261031']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-regression-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, chromium-touch, firefox, webkit, webkit-touch]
    defaults:
      run:
        working-directory: portfolio-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node tools/sync-production.mjs --check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Provide a virtual audio output for Firefox Web Audio evidence
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl info
      - name: Test rebuilt production including all nine films and the gallery
        run: xvfb-run -a pnpm exec playwright test --headed --project=${{ matrix.project }}
        env:
          CI: '1'
          PLAYWRIGHT_TEST_PRODUCTION: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-${{ matrix.project }}-${{ github.sha }}
          path: portfolio-source/test-results/
          retention-days: 14
  native-controller:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portfolio-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - name: WebKit native integration (not Safari or iPhone device certification)
        run: pnpm exec playwright test native.spec.mjs --project=webkit
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-webkit-${{ github.sha }}
          path: portfolio-source/test-results/
          retention-days: 14
