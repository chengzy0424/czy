<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151c1b"><title>Ash Exodus · 网页试玩</title>
<style>*{box-sizing:border-box}body{margin:0;background:#151c1b;color:#ede9dd;font:13px/1.8 "Microsoft YaHei",sans-serif;height:100svh;display:flex;flex-direction:column}header{min-height:48px;padding:4px 18px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #354038}header a{color:#dfb787;text-decoration:none}header strong{font-weight:400}header button{margin-left:auto}button{font:inherit;cursor:pointer;background:#dfb787;color:#151c1b;border:0;padding:10px 18px;min-height:44px}button:focus-visible,a:focus-visible{outline:2px solid #dfb787;outline-offset:4px}button:disabled{opacity:.5;cursor:default}main{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%;background:#151c1b;outline:none;touch-action:none}.cover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;background:#151c1b;padding:25px}.cover p{color:#b6bbae;max-width:560px;margin:8px 0 24px}.cover h1{font-weight:400;font-size:clamp(23px,4vw,38px);margin:0}progress{width:min(300px,75vw);accent-color:#dfb787;height:5px;margin:25px}#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#dfb787;color:#151c1b;border:1px solid #ede9dd}footer{color:#aeb8aa;font-size:10px;padding:8px 18px;min-height:32px}.error{color:#eab19a!important;white-space:pre-wrap;overflow-wrap:anywhere;max-height:45vh;overflow:auto}[hidden]{display:none!important}@media(max-width:600px){header{padding-inline:10px;gap:12px}header strong{font-size:11px}footer{font-size:10px}header a{font-size:11px}header button{padding:8px 12px}}</style></head>
<body><header><a href="../../#works" target="_top">← 回到作品</a><strong>Ash Exodus</strong><button id="fullscreen" disabled>全屏</button></header><main id="stage"><canvas id="game" tabindex="0" aria-label="Ash Exodus游戏画面"></canvas><div id="cover" class="cover"><h1>Ash Exodus</h1><p>键鼠操作；进入游戏后按游戏内说明使用。Esc 可释放鼠标。<br>首次加载约 163.0 MB。此版本正在进行网页体验测试。</p><button id="start">加载并试玩</button><progress id="progress" max="1" value="0" hidden></progress><p id="status" role="status"></p><button id="retry" hidden>重新加载</button></div><button id="hint" hidden>点击画面，进入游戏 · Esc 释放鼠标</button></main><footer>键鼠操作；进入游戏后按游戏内说明使用。Esc 可释放鼠标。 网页测试版。</footer>
<script>
const canvas=document.querySelector('#game'),cover=document.querySelector('#cover'),status=document.querySelector('#status'),progress=document.querySelector('#progress'),hint=document.querySelector('#hint');
let instance,dataObjectUrl;
const dataParts=[{"url":"Build/ash-font-fixed.data.unityweb.part001","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part002","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part003","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part004","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part005","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part006","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part007","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part008","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part009","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part010","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part011","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part012","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part013","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part014","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part015","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part016","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part017","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part018","bytes":8388608},{"url":"Build/ash-font-fixed.data.unityweb.part019","bytes":481075}],downloadController=new AbortController();
function releaseData(){if(dataObjectUrl){URL.revokeObjectURL(dataObjectUrl);dataObjectUrl=null;}}
async function gameDataUrl(){
 if(!dataParts.length)return "Build/ash-font-fixed.data.unityweb";
 const buffers=[],totalBytes=dataParts.reduce((sum,part)=>sum+part.bytes,0);let received=0;
 for(const part of dataParts){
  const response=await fetch(part.url,{signal:downloadController.signal});if(!response.ok)throw new Error('游戏资源下载失败：'+response.status);
  const reader=response.body?.getReader();let partBytes=0;
  if(reader){while(true){const {done,value}=await reader.read();if(done)break;buffers.push(value);received+=value.byteLength;partBytes+=value.byteLength;progress.value=.8*received/totalBytes;status.textContent='正在下载游戏资源 '+Math.round(received/totalBytes*100)+'%';}}
  else{const buffer=await response.arrayBuffer();buffers.push(buffer);received+=buffer.byteLength;partBytes=buffer.byteLength;}
  if(partBytes!==part.bytes)throw new Error('游戏资源不完整，请重新加载。');
 }
 dataObjectUrl=URL.createObjectURL(new Blob(buffers,{type:'application/octet-stream'}));return dataObjectUrl;
}
canvas.addEventListener('contextmenu',event=>event.preventDefault());
document.querySelector('#retry').onclick=()=>location.reload();
function fail(message){releaseData();cover.hidden=false;progress.hidden=true;status.className='error';status.textContent='加载暂未完成。请检查网络或换用电脑浏览器后重试。\n'+String(message).slice(0,500);document.querySelector('#retry').hidden=false;}
document.querySelector('#start').onclick=()=>{
 document.querySelector('#start').hidden=true;progress.hidden=false;status.textContent='正在加载游戏资源…';
 const script=document.createElement('script');script.src="Build/ash-font-fixed.loader.js";script.onerror=()=>fail('无法下载游戏加载器。');
 script.onload=async()=>{try{
  const create=window["createTuanjieInstance"];if(typeof create!=='function'){fail('游戏加载器格式不正确。');return;}
  const dataUrl=await gameDataUrl();
  create(canvas,{dataUrl,frameworkUrl:"Build/ash-font-fixed.framework.js.unityweb",codeUrl:"Build/ash-font-fixed.wasm.unityweb",streamingAssetsUrl:'StreamingAssets',companyName:'Cheng Ziyue',productName:"Ash Exodus",productVersion:'portfolio-web-preview',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),matchWebGLToCanvasSize:true},value=>{progress.value=dataParts.length ? .8+value*.2 : value;status.textContent='正在启动游戏 '+Math.round(value*100)+'%';}).then(game=>{releaseData();instance=game;cover.hidden=true;document.querySelector('#fullscreen').disabled=false;canvas.focus();hint.hidden=false;}).catch(fail);
 }catch(error){fail(error);}};document.body.appendChild(script);
};
function captureChanged(){if(instance){hint.hidden=document.pointerLockElement===canvas;if(!hint.hidden)hint.textContent='点击继续游戏 · Esc 释放鼠标';}}
document.addEventListener('pointerlockchange',captureChanged);
document.addEventListener('pointerlockerror',()=>{if(instance){hint.hidden=false;hint.textContent='鼠标尚未进入游戏，请再次点击';}});
hint.onclick=async()=>{canvas.focus();try{await canvas.requestPointerLock();captureChanged();}catch{hint.hidden=false;hint.textContent='请再次点击进入，或使用全屏';}};
document.querySelector('#fullscreen').onclick=()=>instance?.SetFullscreen(1);
window.addEventListener('pagehide',()=>{downloadController.abort();releaseData();if(instance)instance.Quit();});
</script></body></html>
